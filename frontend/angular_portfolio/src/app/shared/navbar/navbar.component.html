<nav
  class="premium-navbar"
  [class.scrolled]="isScrolled"
>

  <div class="container navbar-inner">

    <!-- ================= LOGO ================= -->
    <a
      class="brand"
      routerLink="/"
      aria-label="Accueil - Papa Mbaye CISSE"
    >

      <div class="brand-mark">
        <span>PM</span>
      </div>

      <div class="brand-text">

        <span class="brand-name">
          Papa Mbaye CISSE
        </span>

        <span class="brand-role">
          Fullstack Developer
        </span>

      </div>

    </a>


    <!-- ================= MOBILE BUTTON ================= -->
    <button
      class="mobile-toggle"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navMenu"
      aria-controls="navMenu"
      aria-label="Ouvrir le menu"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <!-- ================= MENU ================= -->
    <div
      class="collapse navbar-collapse"
      id="navMenu"
    >

      <ul class="premium-menu">

        <!-- ACCUEIL -->
        <li>

          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >

            <span class="nav-icon">⌂</span>
            <span>Accueil</span>

          </a>

        </li>


        <!-- ABOUT -->
        <li>

          <a
            routerLink="/about"
            routerLinkActive="active"
          >

            <span class="nav-icon">✦</span>
            <span>À propos</span>

          </a>

        </li>


        <!-- SKILLS -->
        <li>

          <a
            routerLink="/skills"
            routerLinkActive="active"
          >

            <span class="nav-icon">⚡</span>
            <span>Compétences</span>

          </a>

        </li>


        <!-- PROJECTS -->
        <li>

          <a
            routerLink="/projects"
            routerLinkActive="active"
          >

            <span class="nav-icon">◈</span>
            <span>Projets</span>

          </a>

        </li>


        <!-- EXPERIENCE -->
        <li>

          <a
            routerLink="/experience"
            routerLinkActive="active"
          >

            <span class="nav-icon">◉</span>
            <span>Expérience</span>

          </a>

        </li>


        <!-- ACTIONS -->
        <li class="nav-actions">

          <a
            class="contact-btn"
            routerLink="/contact"
          >

            <span>Me contacter</span>

            <span class="arrow">
              →
            </span>

          </a>


          <a
            class="cv-btn"
            href="assets/cv/Papa_Mbaye_CISSE_CV.pdf"
            download="Papa_Mbaye_CISSE_CV.pdf"
          >

            <span class="cv-icon">
              ↓
            </span>

            CV

          </a>

        </li>

      </ul>

    </div>

  </div>

</nav>
