<header class="nav" [class.nav--scrolled]="isScrolled">
  <div class="container nav__inner">
    <a class="nav__brand mono" href="#accueil" (click)="fermerMenu()">
      <span class="nav__prompt">&gt;_</span><span>papa.cisse</span><span class="nav__muted">/dev</span>
    </a>

    <div class="nav__actions">
      <button
        type="button"
        class="nav__icon-btn"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Passer au thème clair' : 'Passer au thème sombre'"
        [attr.title]="themeService.theme() === 'dark' ? 'Thème clair' : 'Thème sombre'"
      >
        @if (themeService.theme() === 'dark') {
          <!-- soleil -->
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <!-- lune -->
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        }
      </button>

      <button
        type="button"
        class="nav__icon-btn nav__burger"
        (click)="menuOpen = !menuOpen"
        [attr.aria-expanded]="menuOpen"
        aria-controls="menu-principal"
        aria-label="Ouvrir le menu"
      >
        @if (menuOpen) {
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        } @else {
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        }
      </button>
    </div>

    <nav id="menu-principal" class="nav__menu" [class.nav__menu--open]="menuOpen" aria-label="Navigation principale">
      @for (lien of liens; track lien.ancre) {
        <a class="nav__link" [href]="'#' + lien.ancre" (click)="fermerMenu()">{{ lien.libelle }}</a>
      }
      <a class="btn btn--primary nav__cta" href="#contact" (click)="fermerMenu()">Démarrer un projet</a>
    </nav>
  </div>
</header>
