<section id="stack" class="section section--alt">
  <div class="container">
    <p class="eyebrow">// 03 — stack</p>
    <h2 class="section-title">Les outils que j'utilise au quotidien</h2>
    <p class="section-lead">Je choisis la technologie selon le projet, pas l'inverse.</p>

    <div class="stack">
      @for (g of groupes; track g.dossier) {
        <div class="card stack__group mono">
          <div class="stack__folder">{{ g.dossier }}</div>
          <ul>
            @for (o of g.outils; track o) {
              <li>{{ o }}</li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
