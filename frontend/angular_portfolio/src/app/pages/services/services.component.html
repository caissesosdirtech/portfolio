<section id="services" class="section section--alt">
  <div class="container">
    <p class="eyebrow">// 01 — services</p>
    <h2 class="section-title">Ce que je peux construire pour vous</h2>
    <p class="section-lead">Du besoin à la mise en ligne : conception, développement, déploiement et suivi.</p>

    <div class="services">
      @for (s of services; track s.titre) {
        <div class="card service">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            @switch (s.icone) {
              @case ('web') { <rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/> }
              @case ('mobile') { <rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/> }
              @case ('api') { <path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/> }
              @default { <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/> }
            }
          </svg>
          <h3>{{ s.titre }}</h3>
          <p>{{ s.texte }}</p>
        </div>
      }
    </div>
  </div>
</section>
