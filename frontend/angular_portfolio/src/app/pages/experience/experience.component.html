<section id="parcours" class="section">
  <div class="container">
    <p class="eyebrow">// 04 — parcours</p>
    <h2 class="section-title mono">git log --parcours</h2>
    <p class="section-lead">Plus de dix ans entre développement d'applications et administration de systèmes.</p>

    <ol class="timeline">
      @for (e of etapes; track e.date) {
        <li class="timeline__item">
          <span class="timeline__dot" [class.timeline__dot--current]="e.actuel" aria-hidden="true"></span>
          <div>
            <div class="timeline__date mono">{{ e.date }}</div>
            <h3>{{ e.titre }}</h3>
            <p>{{ e.texte }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
